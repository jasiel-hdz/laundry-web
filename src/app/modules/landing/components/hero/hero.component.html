<section class="flex flex-col justify-center items-center mx-auto w-11/12 md:9/12 lg:w-8/12"
  [ngClass]="class" 
  [ngClass]="[
    class,
    withMargin ? 'mt-16 lg:mt-32' : ''
  ]">
  <div class="text-center mb-8 lg:mb-16">
    <h1 class="text-4xl uppercase font-bold text-brandDark-500 mb-4 leading-none">
      {{ title }}
    </h1>
    <p class="text-lg text-gray-600">
      {{ titleDescription }}
    </p>
  </div>

  <div
    class="max-w-6xl mx-auto flex flex-col md:flex-row items-center gap-12"
    [ngClass]="{
      'md:flex-row': direction === 'left',
      'md:flex-row-reverse': direction === 'right'
    }"
  >
    <!-- Imagen -->
    <div class="flex items-center justify-center mx-auto w-full sm:w-1/2">
      <img [src]="imageUrl" [alt]="alt" class="w-full md:w-10/12 rounded-md shadow-md" />
    </div>

    <!-- Contenido -->
    <div class="w-full sm:w-1/2">
      <h2 class="text-2xl font-semibold text-brandDark-600 mb-4">
        {{ contentTitle }}
      </h2>
      <p class="text-gray-700 text-md leading-relaxed">
        {{ contentText }}
      </p>
    </div>
  </div>
</section>
