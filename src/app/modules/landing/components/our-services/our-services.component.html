<div class="container mx-auto w-11/12 md:9/12 lg:w-8/12 flex flex-col justify-center items-center mt-16 lg:mt-32">
  <h2 class="text-4xl uppercase font-bold text-brand-500 mb-4">Nuestros Servicios</h2>
  <p class="mb-16 md:mb-0">This template is designed with a unique and simple, so that it can promote and laundry business
    solution.</p>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-6 items-end">
    <!-- Columna Izquierda -->
    <div class="flex flex-col gap-4 xl:gap-16 col-span-1">
      <ng-container *ngFor="let item of laundryItems.slice(0, 3); let last = last">
        <div class="flex items-center justify-end gap-4 w-full" [class.mb-8]="last">
          <div>
            <h3 class="text-xl font-bold text-darkest-500 text-end">{{ item.title }}</h3>
            <p class="text-end">{{ item.description }}</p>
          </div>
          <img [src]="item.img" [alt]="item.title"
            class="w-20 h-20 object-cover rounded-full border-4 border-brand-500" />
        </div>
      </ng-container>
    </div>

    <!-- Columna vacía en medio -->
    <div class="hidden md:flex items-center justify-center">
      <img src="images/pages/home/own_service_woman.png" alt="Our Services" class="w-72 h-auto" />
    </div>

    <!-- Columna Derecha -->
    <div class="flex flex-col gap-4 xl:gap-16 col-span-1 md:col-start-3">
      <ng-container *ngFor="let item of laundryItems.slice(3, 6); let last = last">
        <div class="flex items-center justify-start gap-4" [class.mb-8]="last">
          <img [src]="item.img" [alt]="item.title"
            class="w-20 h-20 object-cover rounded-full border-4 border-brand-500" />
          <div>
            <h3 class="text-xl font-bold text-darkest-500 text-start">{{ item.title }}</h3>
            <p class="text-start">{{ item.description }}</p>
          </div>
        </div>
      </ng-container>
    </div>
  </div>
  <div class="flex justify-center md:hidden">
    <img src="images/pages/home/own_service_woman.png" alt="Our Services" class="w-72 h-auto" />
  </div>
</div>
