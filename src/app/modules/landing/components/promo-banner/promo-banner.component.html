<section class="h-auto md:!h-90 w-full bg-cover bg-center bg-lightest-500 mt-16 lg:mt-32">
  <div class="grid grid-cols-1 md:grid-cols-2 h-full items-stretch">
    <!-- Image -->
    <div class="w-full h-full">
      <img [src]="imageUrl" [alt]="alt" class="w-full !h-90 object-cover object-top" />
    </div>

    <!-- Text -->
    <div class="w-full flex flex-col justify-center p-6 text-center md:text-left bg-brand-500">
      <h2 class="text-2xl md:text-2xl text-lightest-500 mb-8 text-center font-semibold">
        {{ title }}
      </h2>
      <button mat-raised-button color="primary"
        class="!text-sm mx-auto w-auto uppercase py-4 px-6 font-bold text-lightest-500 rounded-full border-2 border-lightest-500 hover:bg-highlight-500 hover:border-highlight-500 transition-colors duration-300">
        {{ btnText }}
      </button>
    </div>
  </div>
</section>
